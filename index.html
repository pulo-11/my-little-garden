<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my little garden</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">

  <main class="home">
    <div class="home-sun"></div>
    <div class="home-cloud cloud-one"></div>
    <div class="home-cloud cloud-two"></div>

    <section class="home-card">
      <div class="tiny-label">a tiny place to grow</div>

      <h1>my little garden</h1>

      <p>
        a small garden made just for you
      </p>

      <div class="home-scene">
        <div class="home-hill hill-back"></div>
        <div class="home-hill hill-front"></div>

        <div class="home-flower flower-one">
          <span class="petal p1"></span>
          <span class="petal p2"></span>
          <span class="petal p3"></span>
          <span class="petal p4"></span>
          <span class="flower-centre"></span>
          <span class="flower-stem"></span>
        </div>

        <div class="home-flower flower-two">
          <span class="petal p1"></span>
          <span class="petal p2"></span>
          <span class="petal p3"></span>
          <span class="petal p4"></span>
          <span class="flower-centre"></span>
          <span class="flower-stem"></span>
        </div>

        <div class="home-stone stone-one"></div>
        <div class="home-stone stone-two"></div>
      </div>

      <button class="main-button" onclick="location.href='guide.html'">
        <span>enter my garden</span>
        <i></i>
      </button>

      <div class="home-credit">by Pulokali Achumi</div>
    </section>
  </main>

</body>
</html>
